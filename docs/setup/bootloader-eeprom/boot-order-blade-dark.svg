<text x="291" y="142" font-size="30" font-weight="bold" fill="#e3e6ea" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">2</text>
<text x="291" y="174" font-size="17" font-weight="normal" fill="#e3e6ea" text-anchor="middle">network: tried 4th</text>
