<text x="475" y="142" font-size="30" font-weight="bold" fill="#e3e6ea" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">4</text>
<text x="475" y="174" font-size="17" font-weight="normal" fill="#e3e6ea" text-anchor="middle">USB: tried 3rd</text>
<rect x="572" y="106" width="174" height="84" rx="8" fill="#1c2631" stroke="#e3e6ea" stroke-width="2"/>
<text x="659" y="142" font-size="30" font-weight="bold" fill="#e3e6ea" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">6</text>
<text x="659" y="174" font-size="17" font-weight="normal" fill="#e3e6ea" text-anchor="middle">NVMe: tried 2nd</text>
