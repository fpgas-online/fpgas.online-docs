<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="800" height="470" fill="#131416"/>
<text x="20" y="34" font-size="24" font-weight="bold" fill="#e3e6ea" text-anchor="start">Dev model Compute Blade: the DIP switches</text>
<text x="420" y="76" font-size="20" font-weight="bold" fill="#e3e6ea" text-anchor="middle">LEFT</text>
<text x="660" y="76" font-size="20" font-weight="bold" fill="#e3e6ea" text-anchor="middle">RIGHT</text>
<text x="20" y="128" font-size="21" font-weight="bold" fill="#e3e6ea" text-anchor="start">1  Write protection</text>
<rect x="300" y="92" width="480" height="56" rx="10" fill="#2c3036" stroke="#e3e6ea" stroke-width="2"/>
<rect x="308" y="99" width="224" height="42" rx="7" fill="#b00" stroke="#e3e6ea" stroke-width="0"/>
<text x="420" y="127" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Disabled</text>
<text x="660" y="127" font-size="20" font-weight="normal" fill="#c4c9d0" text-anchor="middle">Enabled</text>
<text x="20" y="202" font-size="21" font-weight="bold" fill="#e3e6ea" text-anchor="start">2  Wi-Fi</text>
<rect x="300" y="166" width="480" height="56" rx="10" fill="#2c3036" stroke="#e3e6ea" stroke-width="2"/>
<rect x="308" y="173" width="224" height="42" rx="7" fill="#666" stroke="#e3e6ea" stroke-width="0"/>
<text x="420" y="201" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Enabled</text>
<text x="660" y="201" font-size="20" font-weight="normal" fill="#c4c9d0" text-anchor="middle">Disabled</text>
<text x="20" y="276" font-size="21" font-weight="bold" fill="#e3e6ea" text-anchor="start">3  Bluetooth</text>
<rect x="300" y="240" width="480" height="56" rx="10" fill="#2c3036" stroke="#e3e6ea" stroke-width="2"/>
<rect x="308" y="247" width="224" height="42" rx="7" fill="#666" stroke="#e3e6ea" stroke-width="0"/>
<text x="420" y="275" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">Enabled</text>
<text x="660" y="275" font-size="20" font-weight="normal" fill="#c4c9d0" text-anchor="middle">Disabled</text>
<text x="20" y="338" font-size="19" font-weight="bold" fill="#ff7b7b" text-anchor="start">Switch 1 at LEFT for a bootloader upgrade: that is our reading of the</text>
<text x="20" y="364" font-size="19" font-weight="bold" fill="#ff7b7b" text-anchor="start">two makers' documents. Untested by us.</text>
<text x="20" y="400" font-size="18" font-weight="normal" fill="#e3e6ea" text-anchor="start">Drawn with every switch at LEFT. Which way is left on the board is the</text>
<text x="20" y="424" font-size="18" font-weight="normal" fill="#e3e6ea" text-anchor="start">maker's wording; we have not held one. The maker: change switch</text>
<text x="20" y="448" font-size="18" font-weight="normal" fill="#e3e6ea" text-anchor="start">positions only when the blade is unplugged from power.</text>
</svg>
