<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 425" width="1200" height="425" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1200" height="425" fill="#ffffff"/>
<text x="20" y="32" font-size="22" font-weight="bold">Compute Blade, Dev model, seen from the component side (drawn from the maker's picture)</text>
<rect x="20" y="70" width="1160" height="230" rx="14" fill="#1f4e8c" stroke="#111" stroke-width="2"/>
<rect x="30" y="190" width="110" height="100" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="85.0" y="236.0" font-size="15" text-anchor="middle">Ethernet</text>
<text x="85.0" y="254.0" font-size="15" text-anchor="middle">(PoE)</text>
<rect x="150" y="84" width="44" height="44" rx="5" fill="#ffe9a8" stroke="#b8860b" stroke-width="5"/>
<text x="172.0" y="111.0" font-size="14" text-anchor="middle">DIP</text>
<rect x="205" y="84" width="60" height="90" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="235.0" y="134.0" font-size="15" text-anchor="middle">HDMI</text>
<rect x="275" y="84" width="200" height="206" rx="5" fill="#3b6fb5" stroke="#111" stroke-width="1.5"/>
<text x="375.0" y="174.0" font-size="15" text-anchor="middle">Compute Module</text>
<text x="375.0" y="192.0" font-size="15" text-anchor="middle">(underneath its</text>
<text x="375.0" y="210.0" font-size="15" text-anchor="middle">connectors)</text>
<rect x="500" y="84" width="80" height="80" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="540.0" y="129.0" font-size="15" text-anchor="middle">SD card</text>
<rect x="590" y="118" width="80" height="46" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="630.0" y="146.0" font-size="15" text-anchor="middle">USB-A</text>
<rect x="690" y="84" width="44" height="110" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="712.0" y="144.0" font-size="15" text-anchor="middle">M.2</text>
<rect x="760" y="84" width="400" height="100" rx="5" fill="#3b6fb5" stroke="#111" stroke-width="1.5"/>
<text x="960.0" y="139.0" font-size="15" text-anchor="middle">M.2 SSD positions (2230 to 22110)</text>
<rect x="760" y="205" width="110" height="80" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="815.0" y="241.0" font-size="15" text-anchor="middle">Extension</text>
<text x="815.0" y="259.0" font-size="15" text-anchor="middle">Port</text>
<rect x="880" y="205" width="46" height="80" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="903.0" y="250.0" font-size="15" text-anchor="middle">UART</text>
<rect x="945" y="215" width="78" height="62" rx="5" fill="#d9f7d9" stroke="#22a022" stroke-width="5"/>
<text x="984.0" y="251.0" font-size="16" text-anchor="middle">USB-C</text>
<rect x="1040" y="196" width="110" height="36" rx="5" fill="#f7d9f1" stroke="#c2188f" stroke-width="5"/>
<text x="1095.0" y="219.0" font-size="14" text-anchor="middle">USB switch</text>
<rect x="1052" y="244" width="50" height="46" rx="5" fill="#f7d9d9" stroke="#c81e1e" stroke-width="5"/>
<text x="1077.0" y="264.0" font-size="13" text-anchor="middle">nRPI</text>
<text x="1077.0" y="280.0" font-size="13" text-anchor="middle">BOOT</text>
<text x="470" y="345" font-size="17" fill="#22a022" font-weight="bold">1. USB Type-C port: the cable to the computer that runs rpiboot</text>
<text x="470" y="371" font-size="17" fill="#c2188f" font-weight="bold">2. USB switch: moved to the USB Type-C position</text>
<text x="470" y="397" font-size="17" fill="#c81e1e" font-weight="bold">3. nRPIBOOT button: held down while the cable is connected</text>
<text x="30" y="345" font-size="17" fill="#b8860b" font-weight="bold">DIP: 1 write protection, 2 Wi-Fi, 3 Bluetooth</text>
<text x="30" y="371" font-size="15">A drawing from documentation, not from a board</text>
<text x="30" y="391" font-size="15">in hand: positions are approximate.</text>
<text x="30" y="411" font-size="15">Only the Dev model has these parts.</text>
</svg>
