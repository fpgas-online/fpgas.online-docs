<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 330" width="950" height="330" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="950" height="330" fill="#ffffff"/>
<text x="20" y="36" font-size="26" font-weight="bold" fill="#111" text-anchor="start">The finished card: these four files at the top level, nothing else</text>
<rect x="20" y="60" width="910" height="250" rx="8" fill="#fffbe6" stroke="#b8860b" stroke-width="3"/>
<text x="40" y="92" font-size="18" font-weight="bold" fill="#7a5a00" text-anchor="start">microSD card (one FAT32 partition)</text>
<rect x="40" y="112" width="870" height="40" rx="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="56" y="139" font-size="19" font-weight="bold" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">recovery.bin</text>
<text x="250" y="139" font-size="17" font-weight="normal" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">104314 bytes</text>
<text x="430" y="139" font-size="17" font-weight="normal" fill="#111" text-anchor="start">the program the Pi runs from the card</text>
<rect x="40" y="160" width="870" height="40" rx="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="56" y="187" font-size="19" font-weight="bold" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">pieeprom.bin</text>
<text x="250" y="187" font-size="17" font-weight="normal" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2097152 bytes</text>
<text x="430" y="187" font-size="17" font-weight="normal" fill="#111" text-anchor="start">the 2026/09/25 bootloader with the fleet's settings</text>
<rect x="40" y="208" width="870" height="40" rx="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="56" y="235" font-size="19" font-weight="bold" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">pieeprom.sig</text>
<text x="250" y="235" font-size="17" font-weight="normal" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">80 bytes</text>
<text x="430" y="235" font-size="17" font-weight="normal" fill="#111" text-anchor="start">the checksum of pieeprom.bin</text>
<rect x="40" y="256" width="870" height="40" rx="5" fill="#ffffff" stroke="#111" stroke-width="1.5"/>
<text x="56" y="283" font-size="19" font-weight="bold" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">config.txt</text>
<text x="250" y="283" font-size="17" font-weight="normal" fill="#111" text-anchor="start" font-family="DejaVu Sans Mono, monospace">23 bytes</text>
<text x="430" y="283" font-size="17" font-weight="normal" fill="#111" text-anchor="start">one line: eeprom_write_protect=0</text>
</svg>
