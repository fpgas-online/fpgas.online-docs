<text x="205.0" y="274.05" font-size="13" font-weight="normal" fill="#111" text-anchor="middle">(printed)</text>
<rect x="275" y="84" width="200" height="206" rx="5" fill="#3b6fb5" stroke="#111" stroke-width="1.5"/>
