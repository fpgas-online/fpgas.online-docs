<rect x="30" y="190" width="110" height="100" rx="5" fill="#c9d3df" stroke="#111" stroke-width="1.5"/>
<text x="85.0" y="235.45" font-size="17" font-weight="normal" fill="#111" text-anchor="middle">Ethernet</text>
<text x="85.0" y="256.45" font-size="17" font-weight="normal" fill="#111" text-anchor="middle">(PoE)</text>
<rect x="150" y="84" width="44" height="44" rx="5" fill="#ffe9a8" stroke="#b8860b" stroke-width="5"/>
