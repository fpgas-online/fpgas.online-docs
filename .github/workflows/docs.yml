name: Docs

# Build the documentation on every push and pull request, with the same
# strictness Read the Docs uses (fail_on_warning), so a broken cross-reference
# is caught here rather than on the published site.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install
        run: pip install -r docs/requirements.txt

      - name: Build (warnings are errors, as on Read the Docs)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Check for broken links
        # Informational: external links go down for reasons unrelated to this
        # repository, so a failure here should not block a merge.
        continue-on-error: true
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/_build/html
