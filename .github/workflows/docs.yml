name: Docs

# Build the documentation on every push and pull request, with the same
# strictness Read the Docs uses (fail_on_warning), so a broken cross-reference
# is caught here rather than on the published site.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install
        run: pip install -r docs/requirements.txt

      - name: Test the sync tool
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Build (warnings are errors, as on Read the Docs)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Check for broken links
        # Other people's sites go down for reasons unrelated to this
        # repository, so the check itself does not block a merge; the next
        # step fails for the links that are ours.
        continue-on-error: true
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck

      - name: No broken link into our own repositories and sites
        run: python tools/check_links.py docs/_build/linkcheck/output.json

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/_build/html
