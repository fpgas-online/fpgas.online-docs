# .github/workflows/sync-test-designs.yml
#
# Every day, copy the files these docs take from fpgas.online-test-designs (tools/sync_test_designs.py:
# the Acorn wiring sheets and pin tables) and open a pull request if they changed. The docs build itself
# never reaches out to another repository.
#
# If test-designs no longer has a listed file, the sync fails, this run goes red, and an issue is
# opened (or commented on) saying which file, so the script gets updated instead of the copy going stale.
name: Sync from test-designs

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-test-designs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Copy from test-designs main
        id: sync
        # pipefail: without it the step takes tee's exit status, and a failed sync would pass.
        run: |
          set -o pipefail
          python -u tools/sync_test_designs.py 2>&1 | tee sync.log

      - name: Changed?
        id: diff
        run: |
          git add -A docs/boards/acorn/generated
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # A pull request opened with GITHUB_TOKEN does not trigger the Docs workflow, so build here, with the same
      # strictness, before proposing the change.
      - name: Build the docs with the new files
        if: steps.diff.outputs.changed == 'true'
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/test-designs
          delete-branch: true
          add-paths: docs/boards/acorn/generated
          commit-message: "acorn: sync the wiring sheets and pin tables from fpgas.online-test-designs"
          title: "Sync the Acorn wiring from fpgas.online-test-designs"
          body-path: docs/boards/acorn/generated/SOURCE

      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Sync from fpgas.online-test-designs is failing"
          { echo "The daily sync failed: $RUN_URL"; echo; echo '```'; if [ -f sync.log ]; then tail -40 sync.log; fi; echo '```'; } > body.md
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
